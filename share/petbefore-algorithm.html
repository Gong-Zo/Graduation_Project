<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>펫비포 준비도 알고리즘</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f5f3;
      color: #1c1c1c;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.45;
    }
    main { max-width: 720px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin: 24px 0 12px; }
    .lead { margin: 0 0 20px; }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 20px;
    }
    label { display: grid; gap: 4px; font-size: 14px; margin-bottom: 12px; }
    .time-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    fieldset {
      border: 1px solid #ddd;
      margin: 0 0 16px;
      padding: 12px;
    }
    legend { font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px 12px; }
    .chips label { display: flex; align-items: center; gap: 6px; margin: 0; }
    input, select, button {
      font: inherit;
      padding: 8px;
      border: 1px solid #ccc;
      background: #fff;
      color: inherit;
    }
    button {
      margin-top: 16px;
      padding: 10px 16px;
      background: #2f6f4e;
      border-color: #2f6f4e;
      color: #fff;
      cursor: pointer;
    }
    .result:empty { display: none; }
    .result { margin-top: 20px; padding-top: 16px; border-top: 1px solid #e5e5e5; }
    .score { font-size: 28px; margin: 0 0 8px; }
    .result p { margin: 0 0 6px; }
    .breeds { margin: 12px 0 0; padding: 0; list-style: none; }
    .breeds li { margin: 0 0 12px; }
    .breeds strong { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>펫비포 준비도 알고리즘</h1>
    <p class="lead">생활·경제·책임 각 20문항입니다. 점검하기를 누르면 영역 평균 뒤 0.42·0.31·0.27로 종합합니다. 주거 형태와 사육 가능 여부는 생활 점수에 넣습니다. 견종 이름은 한국어로도 검색할 수 있고, 평가 기준과 맞는 점·안 맞을 수 있는 점을 보여 줍니다.</p>
    <section class="card">
      <form id="form">
        <h2>A. 생활</h2>
        <label>1. 평일 혼자 두는 시간
          <select name="weekdayAlone">
            <option value="under1">1시간 미만</option>
            <option value="h1to2">1~2시간</option>
            <option value="h2to3">2~3시간</option>
            <option value="h3to4">3~4시간</option>
            <option value="h4to5" selected>4~5시간</option>
            <option value="h5plus">5시간 이상</option>
          </select>
        </label>
        <div class="time-row">
        <label>2. 외출 시각
          <select name="leaveHour">
            <option value="0">0시</option>
            <option value="1">1시</option>
            <option value="2">2시</option>
            <option value="3">3시</option>
            <option value="4">4시</option>
            <option value="5">5시</option>
            <option value="6">6시</option>
            <option value="7">7시</option>
            <option value="8" selected>8시</option>
            <option value="9">9시</option>
            <option value="10">10시</option>
            <option value="11">11시</option>
            <option value="12">12시</option>
            <option value="13">13시</option>
            <option value="14">14시</option>
            <option value="15">15시</option>
            <option value="16">16시</option>
            <option value="17">17시</option>
            <option value="18">18시</option>
            <option value="19">19시</option>
            <option value="20">20시</option>
            <option value="21">21시</option>
            <option value="22">22시</option>
            <option value="23">23시</option>
          </select>
        </label>
        <label>분
          <select name="leaveMinute">
            <option value="0">00분</option>
            <option value="30" selected>30분</option>
          </select>
        </label>
        <label>귀가 시각
          <select name="returnHour">
            <option value="0">0시</option>
            <option value="1">1시</option>
            <option value="2">2시</option>
            <option value="3">3시</option>
            <option value="4">4시</option>
            <option value="5">5시</option>
            <option value="6">6시</option>
            <option value="7">7시</option>
            <option value="8">8시</option>
            <option value="9">9시</option>
            <option value="10">10시</option>
            <option value="11">11시</option>
            <option value="12">12시</option>
            <option value="13">13시</option>
            <option value="14">14시</option>
            <option value="15">15시</option>
            <option value="16">16시</option>
            <option value="17">17시</option>
            <option value="18">18시</option>
            <option value="19" selected>19시</option>
            <option value="20">20시</option>
            <option value="21">21시</option>
            <option value="22">22시</option>
            <option value="23">23시</option>
          </select>
        </label>
        <label>분
          <select name="returnMinute">
            <option value="0" selected>00분</option>
            <option value="30">30분</option>
          </select>
        </label>
        </div>
        <label>3. 일주일 외출 일수
          <select name="outingDays">
            <option value="d0to1">0~1일</option>
            <option value="d2to3">2~3일</option>
            <option value="d4to5" selected>4~5일</option>
            <option value="d6to7">6~7일</option>
          </select>
        </label>
        <label>4. 산책 가능 일수
          <select name="walkDays">
            <option value="everyday">매일</option>
            <option value="d5to6">주 5~6일</option>
            <option value="d3to4" selected>주 3~4일</option>
            <option value="d1to2">주 1~2일</option>
            <option value="hard">실천하기 어려움</option>
          </select>
        </label>
        <label>5. 하루 직접 돌봄 시간
          <select name="dailyCare">
            <option value="under30">30분 미만</option>
            <option value="m30to59">30~59분</option>
            <option value="m60to89" selected>60~89분</option>
            <option value="m90to119">90~119분</option>
            <option value="m120plus">120분 이상</option>
            <option value="unknown">판단하기 어려움</option>
          </select>
        </label>
        <label>6. 정시 급여
          <select name="scheduledFeeding">
            <option value="full">충분히 가능</option>
            <option value="mostly" selected>대체로 가능</option>
            <option value="hard">어려울 수 있음</option>
            <option value="unknown">판단하기 어려움</option>
          </select>
        </label>
        <label>7. 실내 놀이·훈련
          <select name="indoorPlay">
            <option value="full">충분히 가능</option>
            <option value="mostly" selected>대체로 가능</option>
            <option value="hard">어려울 수 있음</option>
            <option value="unknown">판단하기 어려움</option>
          </select>
        </label>
        <label>8. 배변 장소 계획
          <select name="toiletPlan">
            <option value="indoor" selected>실내 배변 중심</option>
            <option value="mostlyIndoor">주로 실내·일부 실외</option>
            <option value="mixed">실내외 병행</option>
            <option value="outdoor">주로 실외</option>
            <option value="undecided">미정</option>
          </select>
        </label>
        <label>9. 배변 후 즉시 청결
          <select name="cleanToilet">
            <option value="full">항상 가능</option>
            <option value="mostly" selected>대체로 가능</option>
            <option value="hard">어려울 수 있음</option>
          </select>
        </label>
        <label>10. 산책 후 위생
          <select name="afterWalkHygiene">
            <option value="full">항상 가능</option>
            <option value="mostly" selected>대체로 가능</option>
            <option value="hard">어려울 수 있음</option>
          </select>
        </label>
        <label>11. 소음 부담
          <select name="noiseBurden">
            <option value="none">부담이 거의 없음</option>
            <option value="some" selected>어느 정도 부담됨</option>
            <option value="high">부담이 큼</option>
            <option value="unknown">판단하기 어려움</option>
          </select>
        </label>
        <label>12. 산책 환경
          <select name="walkEnvironment">
            <option value="enough">충분함</option>
            <option value="some" selected>어느 정도 마련되어 있음</option>
            <option value="lacking">부족함</option>
            <option value="unchecked">확인하지 못함</option>
          </select>
        </label>
        <label>13. 주거 형태
          <select name="housingType">
            <option value="studio">원룸</option>
            <option value="officetel">오피스텔</option>
            <option value="apartment" selected>아파트</option>
            <option value="house">주택</option>
            <option value="other">기타</option>
          </select>
        </label>
        <label>14. 반려동물 사육
          <select name="petAllowed">
            <option value="allowed" selected>가능</option>
            <option value="unknown">모름</option>
            <option value="forbidden">불가</option>
          </select>
        </label>
        <label>15. 산책을 못 지킬 이유
          <select name="walkBarrier">
            <option value="overtime" selected>야근·학업</option>
            <option value="weather">날씨</option>
            <option value="fatigue">피로</option>
            <option value="health">건강 문제</option>
            <option value="noHelper">대신 돌봐줄 사람 부족</option>
            <option value="noPlace">산책 장소 부족</option>
            <option value="none">특별히 예상되는 어려움 없음</option>
          </select>
        </label>
        <label>16. 구강 관리
          <select name="dentalCare">
            <option value="daily">매일 가능</option>
            <option value="weekly2to3" selected>주 2~3회 가능</option>
            <option value="weekly1">주 1회 정도 가능</option>
            <option value="hard">꾸준한 관리가 어려움</option>
            <option value="unknown">방법을 잘 모름</option>
          </select>
        </label>
        <label>17. 야간 돌봄
          <select name="nightCare">
            <option value="always">언제든 대응 가능</option>
            <option value="someHours" selected>일부 시간대에만 가능</option>
            <option value="hard">대응이 어려울 수 있음</option>
            <option value="needsHelp">함께 대응할 사람이 필요함</option>
          </select>
        </label>
        <label>18. 평일·주말 차이
          <select name="weekdayWeekendGap">
            <option value="same">거의 같음</option>
            <option value="little" selected>조금 다름</option>
            <option value="much">많이 다름</option>
          </select>
        </label>
        <label>19. 알레르기
          <select name="allergy">
            <option value="none" selected>없음</option>
            <option value="mild">약함</option>
            <option value="severe">심함</option>
            <option value="unchecked">아직 확인 안 함</option>
          </select>
        </label>
        <fieldset>
          <legend>20. 가장 부담될 생활 요소 (최대 3개)</legend>
          <div class="chips">
            <label><input type="checkbox" name="burden" value="longAbsence" checked> 장시간 외출</label>
            <label><input type="checkbox" name="burden" value="dailyWalk" checked> 매일 산책</label>
            <label><input type="checkbox" name="burden" value="toilet"> 배변 관리</label>
            <label><input type="checkbox" name="burden" value="noise"> 소음 문제</label>
            <label><input type="checkbox" name="burden" value="alone"> 혼자 돌보는 부담</label>
            <label><input type="checkbox" name="burden" value="play"> 놀이·훈련 시간</label>
            <label><input type="checkbox" name="burden" value="hygiene"> 위생 관리</label>
            <label><input type="checkbox" name="burden" value="sleep"> 수면 방해</label>
            <label><input type="checkbox" name="burden" value="other"> 기타</label>
          </div>
        </fieldset>
        <h2>B. 경제적 준비</h2>
        <label>1. 기본 양육비 지속 감당
          <select name="canSustainBasicCost">
            <option value="yes" selected>예</option>
            <option value="no">아니요</option>
          </select>
        </label>
        <label>2. 매달 예산 별도 확보
          <select name="hasSeparateBudget">
            <option value="yes">예</option>
            <option value="no" selected>아니요</option>
          </select>
        </label>
        <label>3. 한 달 양육비(병원 제외)
          <select name="monthlyBudget">
            <option value="under3">3만 미만</option>
            <option value="k3to5">3~5만</option>
            <option value="k5to7">5~7만</option>
            <option value="k7to10">7~10만</option>
            <option value="k10to135" selected>10~13.5만</option>
            <option value="k135plus">13.5만 이상</option>
          </select>
        </label>
        <label>4. 지출 점검 계획
          <select name="willTrackSpending">
            <option value="yes" selected>예</option>
            <option value="no">아니요</option>
          </select>
        </label>
        <label>5. 1년 이상 부담 계획
          <select name="willPayOneYear">
            <option value="yes" selected>예</option>
            <option value="no">아니요</option>
          </select>
        </label>
        <label>6. 정기 의료비 감당
          <select name="canCoverRoutineMedical">
            <option value="yes" selected>예</option>
            <option value="no">아니요</option>
          </select>
        </label>
        <label>7. 예상치 못한 지출
          <select name="emergencyFund">
            <option value="under10">10만 미만</option>
            <option value="k10to30" selected>10~30만</option>
            <option value="k30to50">30~50만</option>
            <option value="k50plus">50만 이상</option>
            <option value="none">없음</option>
          </select>
        </label>
        <label>8. 미용 예산 계획
          <select name="plannedGroomingBudget">
            <option value="yes">예</option>
            <option value="no" selected>아니요</option>
          </select>
        </label>
        <label>9. 예상보다 비용이 늘 때
          <select name="canCoverOverrun">
            <option value="yes" selected>예</option>
            <option value="no">아니요</option>
          </select>
        </label>
        <label>10. 노령기 비용
          <select name="canCoverSeniorCost">
            <option value="yes">예</option>
            <option value="no" selected>아니요</option>
          </select>
        </label>
        <label>11. 입양 초기 비용
          <select name="initialCost">
            <option value="full">전액 가능</option>
            <option value="partial" selected>일부 가능</option>
            <option value="hard">어려움</option>
          </select>
        </label>
        <label>12. 월 소득 대비 양육비
          <select name="incomeShare">
            <option value="under5">5% 미만</option>
            <option value="p5to10" selected>5~10%</option>
            <option value="p10plus">10% 이상</option>
            <option value="unknown">모름</option>
          </select>
        </label>
        <label>13. 소득이 줄어도 유지
          <select name="incomeShock">
            <option value="maintain">유지</option>
            <option value="partial" selected>일부</option>
            <option value="hard">어려움</option>
          </select>
        </label>
        <label>14. 펫보험
          <select name="petInsurance">
            <option value="yesOrPlan">들었거나 들 계획</option>
            <option value="no" selected>없음</option>
          </select>
        </label>
        <label>15. 생활비와 동시 감당
          <select name="canCoverWithLivingCost">
            <option value="yes" selected>예</option>
            <option value="no">아니요</option>
          </select>
        </label>
        <label>16. 하루 위탁비
          <select name="boardingDayBudget">
            <option value="under2">2만 미만</option>
            <option value="k2to4" selected>2~4만</option>
            <option value="k4to6">4~6만</option>
            <option value="k6plus">6만 이상</option>
            <option value="unknown">모름</option>
          </select>
        </label>
        <label>17. 정기 검진 횟수
          <select name="checkupPerYear">
            <option value="zero">0회</option>
            <option value="one" selected>1회</option>
            <option value="two">2회</option>
            <option value="threePlus">3회 이상</option>
          </select>
        </label>
        <label>18. 1년 안 큰 지출
          <select name="bigExpenseThisYear">
            <option value="yes" selected>예</option>
            <option value="no">아니요</option>
          </select>
        </label>
        <label>19. 비용 부담
          <select name="whoPays">
            <option value="self" selected>본인이 거의 다 냄</option>
            <option value="family">가족과 나눔</option>
          </select>
        </label>
        <label>20. 지속 병원비
          <select name="canCoverOngoingVet">
            <option value="yes">예</option>
            <option value="no" selected>아니요</option>
          </select>
        </label>
        <h2>C. 돌봄 책임 계획</h2>
        <label>1. 주된 돌봄
          <select name="primaryCarer">
            <option value="self" selected>본인</option>
            <option value="familyShare">가족과 나눔</option>
            <option value="service">돌봄 서비스</option>
          </select>
        </label>
        <label>2. 평일 낮 대체 돌봄
          <select name="hasWeekdayBackup">
            <option value="yes">예</option>
            <option value="no" selected>아니요</option>
          </select>
        </label>
        <label>3. 아플 때 대체 돌봄
          <select name="hasSickBackup">
            <option value="yes">예</option>
            <option value="no" selected>아니요</option>
          </select>
        </label>
        <label>4. 여행·외박 돌봄
          <select name="travelCare">
            <option value="together">동반</option>
            <option value="family">가족·지인</option>
            <option value="boarding">위탁</option>
            <option value="none" selected>아직 없음</option>
          </select>
        </label>
        <label>5. 한 달 외박 일수
          <select name="travelDaysPerMonth">
            <option value="d0to1">0~1일</option>
            <option value="d2to3" selected>2~3일</option>
            <option value="d4to5">4~5일</option>
            <option value="d6plus">6일 이상</option>
          </select>
        </label>
        <label>6. 위탁 시설을 알아보았나
          <select name="checkedBoarding">
            <option value="yes">예</option>
            <option value="no" selected>아니요</option>
          </select>
        </label>
        <label>7. 입양 전 교육
          <select name="tookPreEducation">
            <option value="yes">예</option>
            <option value="no" selected>아니요</option>
          </select>
        </label>
        <label>8. 교육을 계획에 반영
          <select name="appliedEducation">
            <option value="yes">반영함</option>
            <option value="no">반영하지 않음</option>
            <option value="notTaken" selected>교육을 듣지 않음</option>
          </select>
        </label>
        <label>9. 10년 이상 계획
          <select name="hasTenYearPlan">
            <option value="yes">예</option>
            <option value="no" selected>아니요</option>
          </select>
        </label>
        <label>10. 이사·취업 후에도 양육
          <select name="hasMoveJobPlan">
            <option value="yes">예</option>
            <option value="no" selected>아니요</option>
          </select>
        </label>

        "B18 큰 지출": val(form, "bigExpenseThisYear") === "no" ? 100 : 45,
        "B19 비용 분담": val(form, "whoPays") === "family" ? 80 : 70,
        "B20 지속 병원비": yesNo(val(form, "canCoverOngoingVet")),
      };
    }

    function responsibilityItems(form) {
      return {
        "C1 주 돌봄": { self: 90, familyShare: 100, service: 55 }[val(form, "primaryCarer")],
        "C2 낮 대체": yesNo(val(form, "hasWeekdayBackup")),
        "C3 아플 때 대체": yesNo(val(form, "hasSickBackup")),
        "C4 여행 돌봄": { together: 100, family: 90, boarding: 70, none: 0 }[val(form, "travelCare")],
        "C5 외박 일수": { d0to1: 100, d2to3: 75, d4to5: 45, d6plus: 15 }[val(form, "travelDaysPerMonth")],
        "C6 위탁 조사": yesNo(val(form, "checkedBoarding")),
        "C7 입양 전 교육": yesNo(val(form, "tookPreEducation")),
        "C8 교육 반영": { yes: 100, notTaken: 40, no: 20 }[val(form, "appliedEducation")],
        "C9 10년 계획": yesNo(val(form, "hasTenYearPlan")),
        "C10 환경 변화 대책": yesNo(val(form, "hasMoveJobPlan")),
        "C11 응급 병원": yesNo(val(form, "knowsEmergencyClinic")),
        "C12 야간 병원": yesNo(val(form, "knowsNightClinic")),
        "C13 법적 의무": yesNo(val(form, "knowsLegalDuty")),
        "C14 행동 전문가": yesNo(val(form, "knowsBehaviorHelp")),
        "C15 건강 대처": yesNo(val(form, "knowsHealthResponse")),
        "C17 비협조 대책": yesNo(val(form, "hasNoSupportPlan")),
        "C18 산책 담당": yesNo(val(form, "assignedDailyWalker")),
        "C19 동거인 동의": { yes: 100, livesAlone: 70, no: 0 }[val(form, "hasHouseholdConsent")],
        "C20 문제 후에도 책임": yesNo(val(form, "willKeepDespiteProblems")),
      };
    }

    function habits(form) {
      const list = [];
      if (val(form, "weekdayAlone") === "h5plus") list.push("평일 긴 부재");
      if (val(form, "walkDays") === "hard" || val(form, "walkDays") === "d1to2") list.push("산책 일수 부족");
      if (val(form, "dailyCare") === "under30" || val(form, "dailyCare") === "m30to59") list.push("하루 돌봄 시간 부족");
      for (const box of form.querySelectorAll('input[name="burden"]:checked')) {
        list.push(BURDEN_LABEL[box.value]);
      }
      if (val(form, "hasSickBackup") === "no") list.push("돌봄 연속 대책 부족");
      const budget = val(form, "monthlyBudget");
      if (budget === "under3" || budget === "k3to5" || budget === "k5to7") list.push("월 양육 예산 부족");
      return [...new Set(list)];
    }

    function careMinutes(dailyCare) {
      return { under30: 20, m30to59: 45, m60to89: 75, m90to119: 105, m120plus: 120, unknown: 60 }[dailyCare];
    }

    function outingDays(value) {
      return { d0to1: 1, d2to3: 3, d4to5: 5, d6to7: 7 }[value];
    }

    function monthlyBudgetKrw(value) {
      return { under3: 20000, k3to5: 40000, k5to7: 60000, k7to10: 85000, k10to135: 120000, k135plus: 135000 }[value];
    }

    function preferenceFrom(form) {
      const absence = absenceHours(form);
      const care = careMinutes(val(form, "dailyCare"));
      const outing = outingDays(val(form, "outingDays"));
      const budget = monthlyBudgetKrw(val(form, "monthlyBudget"));
      const noiseSensitive = val(form, "noiseBurden") === "some" || val(form, "noiseBurden") === "high";
      const lowTime = absence >= 8 || care < 60 || outing >= 5;
      const highTime = absence <= 4 && care >= 90 && outing <= 2;
      const energy = lowTime ? 2 : highTime ? 4 : 3;
      const maxBarking = noiseSensitive ? 2 : null;
      const maxGrooming = budget < 135000 ? 2 : null;
      const reasons = [];
      if (lowTime) reasons.push("집에 있는 시간이 짧아 활동량이 낮은 견종");
      else if (highTime) reasons.push("돌봄 시간을 확보할 수 있어 활동량이 있는 견종");
      else reasons.push("생활 시간에 맞춘 중간 활동량 견종");
      if (noiseSensitive) reasons.push("소음에 취약해 짖음이 낮은 견종");
      if (maxGrooming != null) reasons.push("월 예산이 평균보다 낮아 미용 부담이 작은 견종");
      return {
        energy,
        maxBarking,
        maxGrooming,
        maxShedding: null,
        summary: reasons.join(", ") + "을 앞에 둡니다.",
      };
    }

    function evaluate(form) {
      const lifeMap = lifeItems(form);
      const economyMap = economyItems(form);
      const responsibilityMap = responsibilityItems(form);
      const life = average(Object.values(lifeMap));
      const economy = average(Object.values(economyMap));
      const responsibility = average(Object.values(responsibilityMap));
      const total = Math.round(life * 0.42 + economy * 0.31 + responsibility * 0.27);
      const warnings = [];
      if (val(form, "petAllowed") === "forbidden") warnings.push("건물에서 반려동물 사육이 불가합니다.");
      if (val(form, "allergy") === "severe") warnings.push("알레르기가 심해 양육 전 확인이 필요합니다.");
      if (absenceHours(form) >= 10) warnings.push("하루 부재 시간이 10시간 이상입니다.");
      let label = total >= 75 ? "준비완료" : total >= 50 ? "보완필요" : "경고";
      if (warnings.length > 0 && label === "준비완료") label = "보완필요";
      const preference = preferenceFrom(form);
      return {
        life, economy, responsibility, total, label, warnings,
        habits: habits(form),
        summary: preference.summary,
        preference,
        breeds: rankBreeds(poolFor(preference.energy), preference),
      };
    }

    function energyOrder(energy) {
      if (energy === 1) return [1, 2];
      if (energy === 2) return [2, 1, 3];
      if (energy === 4) return [4, 3, 5];
      if (energy === 5) return [5, 4];
      return [3, 2, 4];
    }

    function poolFor(energy) {
      for (const level of energyOrder(energy)) {
        const found = BREEDS.filter((breed) => breed.energy === level);
        if (found.length) return found;
      }
      return [];
    }

    function limitScore(value, max, weight) {
      if (max == null) return 0;
      return value <= max ? weight : -weight;
    }

    function breedScore(breed, preference) {
      return (breed.energy === preference.energy ? 3 : 0) +
        limitScore(breed.barking, preference.maxBarking, 2) +
        limitScore(breed.grooming, preference.maxGrooming, 1) +
        limitScore(breed.shedding, preference.maxShedding, 1);
    }

    function displayName(englishName) {
      const korean = NAMES_KO[englishName];
      if (korean) return englishName + " (" + korean + ")";
      const lower = englishName.toLowerCase();
      for (const [key, value] of Object.entries(NAMES_KO)) {
        if (lower === key.toLowerCase() || lower.includes(key.toLowerCase()) || key.toLowerCase().includes(lower)) {
          return englishName + " (" + value + ")";
        }
      }
      return englishName;
    }

    function englishBreedQueries(input) {
      const query = input.trim();
      if (!query) return [];
      if (!/[\uAC00-\uD7A3]/.test(query)) return [query];
      const compact = query.replace(/\s+/g, "");
      const names = new Set();
      for (const [alias, english] of Object.entries(SEARCH_ALIASES)) {
        if (compact.includes(alias) || alias.includes(compact)) english.forEach((name) => names.add(name));
      }
      for (const [english, korean] of Object.entries(NAMES_KO)) {
        const compactKorean = korean.replace(/\s+/g, "");
        if (compactKorean.includes(compact) || compact.includes(compactKorean)) names.add(english);
      }
      return [...names];
    }

    function breedFitLines(breed, preference) {
      const energyFits = breed.energy === preference.energy;
      const lines = [{
        fits: energyFits,
        text: energyFits
          ? "활동량: 맞음 · 생활 기준 " + preference.energy + ", 이 견종 " + breed.energy
          : "활동량: 안 맞을 수 있음 · 생활 기준 " + preference.energy + "인데 이 견종은 " + breed.energy,
      }];
      if (preference.maxBarking != null) {
        const fits = breed.barking <= preference.maxBarking;
        lines.push({
          fits,
          text: fits
            ? "짖음: 맞음 · 기준 " + preference.maxBarking + " 이하, 이 견종 " + breed.barking
            : "짖음: 안 맞을 수 있음 · 소음에 부담이 있어 " + preference.maxBarking + " 이하가 좋은데 이 견종은 " + breed.barking,
        });
      }
      if (preference.maxGrooming != null) {
        const fits = breed.grooming <= preference.maxGrooming;
        lines.push({
          fits,
          text: fits
            ? "미용: 맞음 · 기준 " + preference.maxGrooming + " 이하, 이 견종 " + breed.grooming
            : "미용: 안 맞을 수 있음 · 예산 대비 미용 부담이 큼. 기준 " + preference.maxGrooming + " 이하, 이 견종 " + breed.grooming,
        });
      }
      return lines;
    }

    function rankBreeds(breeds, preference) {
      return breeds
        .map((breed) => {
          const fit = breedFitLines(breed, preference);
          return {
            ...breed,
            fit,
            notes: fit.map((line) => line.text),
            score: breedScore(breed, preference),
          };
        })
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name))
        .slice(0, 5);
    }

    function searchBreeds(query, preference) {
      const queries = englishBreedQueries(query);
      if (!queries.length) return { missing: true, breeds: [] };
      const found = BREEDS.filter((breed) =>
        queries.some((name) => breed.name.toLowerCase().includes(name.toLowerCase()))
      );
      return { missing: false, breeds: rankBreeds(found, preference) };
    }

    function render(result) {
      const lines = [
        result.label,
        "생활 " + result.life + "점",
        "경제 " + result.economy + "점",
        "책임 " + result.responsibility + "점",
      ];
      if (result.warnings.length) lines.push(result.warnings.join(" "));
      if (result.habits.length) {
        lines.push("보완이 필요해 보이는 생활 습관");
        for (const habit of result.habits) lines.push("· " + habit);
      }
      lines.push(result.summary);
      const box = document.getElementById("result");
      box.replaceChildren();
      const score = document.createElement("p");
      score.className = "score";
      score.textContent = "종합 " + result.total + "점";
      box.append(score);
      for (const line of lines) {
        const p = document.createElement("p");
        p.textContent = line;
        box.append(p);
      }
      const title = document.createElement("p");
      title.textContent = "추천 견종";
      box.append(title);
      const list = document.createElement("ul");
      list.className = "breeds";
      for (const breed of result.breeds) {
        const item = document.createElement("li");
        const name = document.createElement("strong");
        name.textContent = displayName(breed.name);
        const traits = document.createElement("span");
        traits.textContent = "활동량 " + breed.energy + " · 짖음 " + breed.barking + " · 털 빠짐 " + breed.shedding + " · 미용 " + breed.grooming;
        item.append(name, document.createElement("br"), traits);
        const heading = document.createElement("div");
        heading.textContent = (breed.fit || []).every((line) => line.fits)
          ? "평가 기준과 대체로 맞습니다."
          : "맞는 점과 안 맞을 수 있는 점";
        item.append(heading);
        for (const note of breed.notes) {
          const noteLine = document.createElement("div");
          noteLine.textContent = note;
          item.append(noteLine);
        }
        list.append(item);
      }
      if (!result.breeds.length) {
        const empty = document.createElement("p");
        empty.textContent = result.emptyMessage || "조건에 맞는 견종이 없습니다.";
        box.append(empty);
      }
      box.append(list);
      const boundary = document.createElement("p");
      boundary.textContent = "이 안내는 입양 허가나 거부가 아닙니다.";
      box.append(boundary);
    }

    const form = document.getElementById("form");
    let lastResult = null;

    form.addEventListener("change", (event) => {
      if (event.target.name !== "burden") return;
      const checked = [...form.querySelectorAll('input[name="burden"]:checked')];
      if (checked.length > 3) event.target.checked = false;
    });

    document.getElementById("check").addEventListener("click", () => {
      lastResult = evaluate(form);
      render(lastResult);
    });

    document.getElementById("search").addEventListener("click", () => {
      const query = document.getElementById("breedName").value.trim();
      if (!lastResult) lastResult = evaluate(form);
      if (!query) {
        render(lastResult);
        return;
      }
      const searched = searchBreeds(query, lastResult.preference);
      if (searched.missing) {
        render({
          ...lastResult,
          breeds: [],
          emptyMessage: "해당하는 견종 이름을 찾지 못했습니다. 영어 이름도 함께 적어 보세요.",
        });
        return;
      }
      render({ ...lastResult, breeds: searched.breeds });
    });
  </script>
</body>
