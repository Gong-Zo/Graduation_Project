<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>펫비포 준비도 알고리즘</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f5f3;
      color: #1c1c1c;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.45;
    }
    main { max-width: 720px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .lead { margin: 0 0 20px; }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 20px;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    label { display: grid; gap: 4px; font-size: 14px; }
    input, select, button {
      font: inherit;
      padding: 8px;
      border: 1px solid #ccc;
      background: #fff;
      color: inherit;
    }
    button {
      margin-top: 16px;
      padding: 10px 16px;
      background: #2f6f4e;
      border-color: #2f6f4e;
      color: #fff;
      cursor: pointer;
    }
    .result:empty { display: none; }
    .result { margin-top: 20px; padding-top: 16px; border-top: 1px solid #e5e5e5; }
    .score { font-size: 28px; margin: 0 0 8px; }
    .result p { margin: 0 0 6px; }
    .breeds { margin: 12px 0 0; padding: 0; list-style: none; }
    .breeds li { margin: 0 0 12px; }
    .breeds strong { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>펫비포 준비도 알고리즘</h1>
    <p class="lead">사전 자가점검으로 종합 점수와 맞는 견종을 계산합니다. 견종 이름은 한국어로도 검색할 수 있고, 평가 기준과 맞는 점·안 맞을 수 있는 점을 보여 줍니다.</p>
    <section class="card">
      <form id="form">
        <div class="grid">
          <label>하루 부재 시간<input name="absence" type="number" min="0" max="24" value="8"></label>
          <label>돌봄 시간(분)<input name="care" type="number" min="0" value="60"></label>
          <label>주간 외출 일수<input name="outing" type="number" min="0" max="7" value="3"></label>
          <label>월 양육 예산(원)<input name="budget" type="number" min="0" value="100000"></label>
          <label>주거
            <select name="housing">
              <option value="studio" selected>원룸</option>
              <option value="officetel">오피스텔</option>
              <option value="apartment">아파트</option>
              <option value="house">주택</option>
            </select>
          </label>
          <label>반려동물 사육
            <select name="pet">
              <option value="allowed">가능</option>
              <option value="unknown" selected>불명</option>
              <option value="forbidden">불가</option>
            </select>
          </label>
          <label>비상 의료비
            <select name="emergency">
              <option value="none">없음</option>
              <option value="partial" selected>일부</option>
              <option value="ready">확보</option>
            </select>
          </label>
          <label>소득이 줄어도 양육비
            <select name="income">
              <option value="cannot">어렵다</option>
              <option value="partial" selected>일부 가능하다</option>
              <option value="can">유지할 수 있다</option>
            </select>
          </label>
          <label>알레르기
            <select name="allergy">
              <option value="none" selected>없음</option>
              <option value="mild">약함</option>
              <option value="severe">심함</option>
            </select>
          </label>
          <label>산책 환경이 있다
            <select name="walk"><option value="0" selected>아니오</option><option value="1">예</option></select>
          </label>
          <label>소음에 취약하다
            <select name="noise"><option value="1" selected>예</option><option value="0">아니오</option></select>
          </label>
          <label>초기 비용을 부담할 수 있다
            <select name="initial"><option value="0" selected>아니오</option><option value="1">예</option></select>
          </label>
          <label>장기 양육 계획이 있다
            <select name="plan"><option value="0" selected>아니오</option><option value="1">예</option></select>
          </label>
          <label>돌봄을 이어 갈 사람이 있다
            <select name="continuity"><option value="0" selected>아니오</option><option value="1">예</option></select>
          </label>
        </div>
        <button type="button" id="check">점검하기</button>
        <label>다른 견종 이름
          <input id="breedName" type="text" placeholder="예: 푸들, 시바견, golden retriever">
        </label>
        <button type="button" id="search">견종 이름 검색</button>
      </form>
      <div class="result" id="result"></div>
    </section>
  </main>

      const value = Number(form.elements[name].value);
      return Number.isFinite(value) ? value : 0;

    function carePoints(minutes) {
      if (minutes >= 120) return 35;
      if (minutes >= 90) return 28;
      if (minutes >= 60) return 18;
      if (minutes >= 30) return 8;
      return 0;
    }

      else reasons.push("생활 시간에 맞춘 중간 활동량 견종");
      if (input.noise) reasons.push("소음에 취약해 짖음이 낮은 견종");
      if (maxGrooming != null) reasons.push("월 예산이 평균보다 낮아 미용 부담이 작은 견종");
      if (maxShedding != null) reasons.push("좁은 주거라 털 빠짐이 적은 견종");
      const preference = { energy, maxBarking, maxGrooming, maxShedding };
      const breeds = rankBreeds(poolFor(energy), preference);

      return {
        life, economy, responsibility, housing, total, label, warnings,
        summary: reasons.join(", ") + "을 앞에 둡니다.",
        preference,
        breeds,
      };
    }

    function energyOrder(energy) {
      if (energy === 1) return [1, 2];
      if (energy === 2) return [2, 1, 3];
      if (energy === 4) return [4, 3, 5];
      if (energy === 5) return [5, 4];
      return [3, 2, 4];
    }

    function poolFor(energy) {
      for (const level of energyOrder(energy)) {
        const found = BREEDS.filter((breed) => breed.energy === level);
        if (found.length) return found;
      }
      return [];
    }

    function limitScore(value, max, weight) {
      if (max == null) return 0;
      return value <= max ? weight : -weight;
    }

    function breedScore(breed, preference) {
      return (breed.energy === preference.energy ? 3 : 0) +
        limitScore(breed.barking, preference.maxBarking, 2) +
        limitScore(breed.grooming, preference.maxGrooming, 1) +
        limitScore(breed.shedding, preference.maxShedding, 1);
    }

    function displayName(englishName) {
      const korean = NAMES_KO[englishName];
      if (korean) return englishName + " (" + korean + ")";
      const lower = englishName.toLowerCase();
      for (const [key, value] of Object.entries(NAMES_KO)) {
        if (lower === key.toLowerCase() || lower.includes(key.toLowerCase()) || key.toLowerCase().includes(lower)) {
          return englishName + " (" + value + ")";
        }
      }
      return englishName;
    }

    function englishBreedQueries(input) {
      const query = input.trim();
      if (!query) return [];
      if (!/[\uAC00-\uD7A3]/.test(query)) return [query];
      const compact = query.replace(/\s+/g, "");
      const names = new Set();
      for (const [alias, english] of Object.entries(SEARCH_ALIASES)) {
        if (compact.includes(alias) || alias.includes(compact)) english.forEach((name) => names.add(name));
      }
      for (const [english, korean] of Object.entries(NAMES_KO)) {
        const compactKorean = korean.replace(/\s+/g, "");
        if (compactKorean.includes(compact) || compact.includes(compactKorean)) names.add(english);
      }
      return [...names];
    }

    function breedFitLines(breed, preference) {
      const energyFits = breed.energy === preference.energy;
      const lines = [{
        fits: energyFits,
        text: energyFits
          ? "활동량: 맞음 · 생활 기준 " + preference.energy + ", 이 견종 " + breed.energy
          : "활동량: 안 맞을 수 있음 · 생활 기준 " + preference.energy + "인데 이 견종은 " + breed.energy,
      }];
      if (preference.maxBarking != null) {
        const fits = breed.barking <= preference.maxBarking;
        lines.push({
          fits,
          text: fits
            ? "짖음: 맞음 · 기준 " + preference.maxBarking + " 이하, 이 견종 " + breed.barking
            : "짖음: 안 맞을 수 있음 · 소음에 부담이 있어 " + preference.maxBarking + " 이하가 좋은데 이 견종은 " + breed.barking,
        });
      }
      if (preference.maxGrooming != null) {
        const fits = breed.grooming <= preference.maxGrooming;
        lines.push({
          fits,
          text: fits
            ? "미용: 맞음 · 기준 " + preference.maxGrooming + " 이하, 이 견종 " + breed.grooming
            : "미용: 안 맞을 수 있음 · 예산 대비 미용 부담이 큼. 기준 " + preference.maxGrooming + " 이하, 이 견종 " + breed.grooming,
        });
      }
      return lines;
    }

    function rankBreeds(breeds, preference) {
      return breeds
        .map((breed) => {
          const fit = breedFitLines(breed, preference);
          return {
            ...breed,
            fit,
            notes: fit.map((line) => line.text),
            score: breedScore(breed, preference),
          };
        })
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name))
        .slice(0, 5);
    }

    function searchBreeds(query, preference) {
      const queries = englishBreedQueries(query);
      if (!queries.length) return { missing: true, breeds: [] };
      const found = BREEDS.filter((breed) =>
        queries.some((name) => breed.name.toLowerCase().includes(name.toLowerCase()))
      );
      return { missing: false, breeds: rankBreeds(found, preference) };
    }

    function readForm(form) {
      return {
        absence: num(form, "absence"),
        care: num(form, "care"),
        outing: num(form, "outing"),
        budget: num(form, "budget"),
        housing: form.elements.housing.value,
        pet: form.elements.pet.value,
        emergency: form.elements.emergency.value,
        income: form.elements.income.value,
        allergy: form.elements.allergy.value,
        walk: form.elements.walk.value === "1",
        noise: form.elements.noise.value === "1",
        initial: form.elements.initial.value === "1",
        plan: form.elements.plan.value === "1",
        continuity: form.elements.continuity.value === "1",
      };
    }

    function render(result) {
      const lines = [
        result.label,
        "생활 " + result.life + "점",
        "경제 " + result.economy + "점",
        "책임 " + result.responsibility + "점",
        "주거 " + result.housing + "점 · 참고",
      ];
      if (result.warnings.length) lines.push(result.warnings.join(" "));
      lines.push(result.summary);
      const box = document.getElementById("result");
      box.replaceChildren();
      const score = document.createElement("p");
      score.className = "score";
      score.textContent = "종합 " + result.total + "점";
      box.append(score);
      for (const line of lines) {
        const p = document.createElement("p");
        p.textContent = line;
        box.append(p);
      }
      const title = document.createElement("p");
      title.textContent = "추천 견종";
      box.append(title);
      const list = document.createElement("ul");
      list.className = "breeds";
      for (const breed of result.breeds) {
        const item = document.createElement("li");
        const name = document.createElement("strong");
        name.textContent = displayName(breed.name);
        const traits = document.createElement("span");
        traits.textContent = "활동량 " + breed.energy + " · 짖음 " + breed.barking + " · 털 빠짐 " + breed.shedding + " · 미용 " + breed.grooming;
        item.append(name, document.createElement("br"), traits);
        const heading = document.createElement("div");
        heading.textContent = (breed.fit || []).every((line) => line.fits)
          ? "평가 기준과 대체로 맞습니다."
          : "맞는 점과 안 맞을 수 있는 점";
        item.append(heading);
        for (const note of breed.notes) {
          const noteLine = document.createElement("div");
          noteLine.textContent = note;
          item.append(noteLine);
        }
        list.append(item);
      }
      if (!result.breeds.length) {
        const empty = document.createElement("p");
        empty.textContent = result.emptyMessage || "조건에 맞는 견종이 없습니다.";
        box.append(empty);
      }
      box.append(list);
      const boundary = document.createElement("p");
      boundary.textContent = "이 안내는 입양 허가나 거부가 아닙니다.";
      box.append(boundary);
    }

    const form = document.getElementById("form");
    let lastResult = null;

    document.getElementById("check").addEventListener("click", () => {
      lastResult = evaluate(readForm(form));
      render(lastResult);
    });

    document.getElementById("search").addEventListener("click", () => {
      const query = document.getElementById("breedName").value.trim();
      if (!lastResult) lastResult = evaluate(readForm(form));
      if (!query) {
        render(lastResult);
        return;
      }
      const searched = searchBreeds(query, lastResult.preference);
      if (searched.missing) {
        render({
          ...lastResult,
          breeds: [],
          emptyMessage: "해당하는 견종 이름을 찾지 못했습니다. 영어 이름도 함께 적어 보세요.",
        });
        return;
      }
      render({ ...lastResult, breeds: searched.breeds });
    });
  </script>
</body>
