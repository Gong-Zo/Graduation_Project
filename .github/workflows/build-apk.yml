name: Android APK 빌드

# develop에 푸시되면 자동으로, Actions 탭에서 수동으로도 실행할 수 있다.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Flutter APK 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter SDK 준비
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      # .gitignore에 등록되어 저장소에 없는 lib/diagnosis/guide/local_api_key.dart를
      # 빌드 직전에 만든다. 실제 키는 GitHub Secrets에 있으면 주입되고,
      # 없으면 빈 문자열이라 키 없이도 컴파일·실행이 된다.
      - name: 로컬 API 키 파일 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
        run: |
          mkdir -p lib/diagnosis/guide
          {
            echo "/// CI 빌드용으로 자동 생성된 파일이다. 커밋하지 않는다."
            echo "/// 실제 키는 GitHub Secrets(GEMINI_API_KEY, DATA_GO_KR_SERVICE_KEY, API_NINJAS_KEY)에서 주입된다."
            echo "const String localGeminiApiKey = '${GEMINI_API_KEY}';"
            echo "const String localDataGoKrServiceKey = '${DATA_GO_KR_SERVICE_KEY}';"
            echo "const String localApiNinjasKey = '${API_NINJAS_KEY}';"
          } > lib/diagnosis/guide/local_api_key.dart
          echo "local_api_key.dart 생성 완료: $(wc -l < lib/diagnosis/guide/local_api_key.dart)줄"

      - name: 의존성 설치
        run: flutter pub get

      - name: 릴리스 APK 빌드
        run: flutter build apk --release

      - name: APK 확인
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          ls -l "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          {
            echo "### 펫비포 APK 빌드 결과"
            echo ""
            echo "- 커밋: \`${{ github.sha }}\`"
            echo "- 브랜치: \`${{ github.ref_name }}\`"
            echo "- 크기: $(stat -c%s "$APK") bytes"
            echo "- SHA-256: \`$(cut -d' ' -f1 apk-sha256.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: latest-apk 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 펫비포 최신 APK
          body: |
            `develop` 최신 커밋(${{ github.sha }})으로 자동 빌드한 안드로이드 APK입니다.

            - 브랜치: ${{ github.ref_name }}
            - 빌드 시각(KST): ${{ github.run_started_at }}
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true
